name: CI/CD Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  ci:
    name: Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
        continue-on-error: true

  deploy:
    name: Deploy to VM
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail

            cd /home/opc/hema-app
            git fetch origin main
            git reset --hard origin/main

            ACTUAL_SHA=$(git rev-parse HEAD)
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "ERRO: VM em $ACTUAL_SHA, esperado $EXPECTED_SHA"
              exit 1
            fi
            echo "Código sincronizado em $ACTUAL_SHA"

            cd backend
            docker build -t hema-app-backend-image .
            docker stop hema-app-backend || true
            docker rm hema-app-backend || true
            docker run -d \
              --name hema-app-backend \
              --restart unless-stopped \
              --env-file .env \
              -p 3006:3000 \
              hema-app-backend-image

            sleep 3
            docker ps --filter name=hema-app-backend --filter status=running | grep -q hema-app-backend
            echo "Deploy concluído em $ACTUAL_SHA"
